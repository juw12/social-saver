name: web-downloader

# The free web version (Vercel): a real TikTok search + download from a datacenter IP,
# and the same build Vercel runs, so a broken deploy shows up here first.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"  # weekly: catches site changes that break the engine

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (exactly what Vercel installs)
        run: python -m pip install -r requirements.txt
      - name: pywebview is skipped on Linux
        run: "! python -m pip show pywebview"
      - name: Real search, file and zip
        run: python .github/scripts/live_webdl.py

  vercel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: uv (Vercel's Python builder uses it)
        run: python -m pip install uv
      - name: Build like Vercel does (no account needed)
        run: |
          mkdir -p .vercel
          echo '{"projectId":"ci","orgId":"ci","settings":{"framework":null}}' > .vercel/project.json
          npx --yes vercel@latest build --yes
      - name: Check the output
        run: |
          ls .vercel/output/functions/api
          test -d .vercel/output/functions/api/index.func
          du -sh .vercel/output/functions/api/index.func
          python3 -c "import json; c=json.load(open('.vercel/output/config.json')); print(json.dumps(c['routes'], indent=1)[:1500])"
          python3 - <<'EOF'
          import json
          config = json.load(open(".vercel/output/functions/api/index.func/.vc-config.json"))
          print({key: value for key, value in config.items() if key != "filePathMap"})
          files = list((config.get("filePathMap") or {}).keys())
          print(len(files), "files in the function, for example:", sorted(f for f in files if "site-packages" not in f)[:40])
          assert config.get("runtime", "").startswith("python"), "not a Python function"
          assert config.get("maxDuration") == 300, "maxDuration should be 300 s"
          for needed in ("saver/webdl.py", "saver/core.py", "web/index.html", "static/icon-192.png", "api/index.py"):
              assert any(f.endswith(needed) for f in files), needed + " missing from the function"
          assert not any(f.startswith("android/") for f in files), "android/ should be excluded"
          assert any("gallery_dl" in f for f in files) or True  # dependencies may be installed at deploy time
          print("function bundle OK")
          EOF
