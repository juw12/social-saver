name: web-app

# Builds the web-app container and checks it like a phone would: password page, login,
# then a real download through the engine inside the container.
on:
  push:
  workflow_dispatch:

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t social-saver .
      - name: Start with a password
        run: |
          docker run -d --name saver -p 8080:8765 -e SOCIAL_SAVER_PASSWORD=ci-secret \
            --add-host=host.docker.internal:host-gateway social-saver
          for _ in $(seq 1 40); do curl -fsS localhost:8080/healthz && break; sleep 2; done
      - name: Password page, login and the screen
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = 401
          curl -s localhost:8080/ | grep -q 'type="password"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -d password=wrong localhost:8080/login)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -c jar -d password=ci-secret localhost:8080/login)" = 302
          curl -s -b jar localhost:8080/ | grep -q 'const MODE = "web"'
          curl -s localhost:8080/manifest.webmanifest | grep -q share_target
      - name: Real download inside the container
        run: |
          mkdir served && printf 'fake jpeg bytes' > served/test.jpg
          (cd served && nohup python3 -m http.server 8000 > /dev/null 2>&1 &)
          sleep 1
          docker exec saver python app.py --self-test http://host.docker.internal:8000/test.jpg
      - name: Server log
        if: always()
        run: docker logs saver
