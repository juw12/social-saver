name: android

# Builds the Android app (Python inside, via Chaquopy), runs it on an emulator, and attaches
# SocialSaver-android.apk to the GitHub release when a v* tag is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # Chaquopy runs pip with the same Python version
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.11.1"
      - name: Copy the Python app into the Android project
        run: bash android/sync.sh
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then export VERSION_NAME="${GITHUB_REF_NAME#v}"; else export VERSION_NAME="dev-${GITHUB_SHA::7}"; fi
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../SocialSaver-android.apk
          ls -l ../SocialSaver-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: SocialSaver-android
          path: SocialSaver-android.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: SocialSaver-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 15
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash android/ci/emulator-test.sh SocialSaver-android.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-result
          path: |
            android-screen.png
            android-log.txt

  release:
    needs: [build, emulator]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SocialSaver-android
      # release.yml made the release without marking it latest. With the APK attached it has both downloads,
      # so it becomes the latest release here.
      - name: Attach the APK to the release, then mark it latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" SocialSaver-android.apk --clobber -R "$GITHUB_REPOSITORY"; then
              gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "SocialSaver-windows.zip"
              gh release edit "$GITHUB_REF_NAME" --latest -R "$GITHUB_REPOSITORY"
              exit 0
            fi
            sleep 30
          done
          exit 1
