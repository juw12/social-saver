name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install gallery-dl flask requests segno pytest
      - name: Test
        run: python -m pytest -q
      - name: Check the Android setup script
        if: runner.os == 'Linux'
        run: bash -n mobile/termux-setup.sh
      - name: Check the Mac start file
        if: runner.os == 'macOS'
        run: |
          bash -n "Start Social Saver.command"
          test -x "Start Social Saver.command"
